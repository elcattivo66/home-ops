---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          otbr-port-fix:
            image:
              repository: docker.io/library/alpine
              tag: 3.20
            command:
              - /bin/sh
              - -ec
              - |
                apk add --no-cache iptables ip6tables >/dev/null 2>&1
                iptables -t nat -C OUTPUT -d 192.168.30.140 -p tcp --dport 8081 -j DNAT --to-destination 192.168.30.140:8080 2>/dev/null || \
                  iptables -t nat -A OUTPUT -d 192.168.30.140 -p tcp --dport 8081 -j DNAT --to-destination 192.168.30.140:8080
                ip6tables -t nat -C OUTPUT -d fd00:30::5078:7dff:fed7:d6e4 -p tcp --dport 8081 -j DNAT --to-destination [fd00:30::5078:7dff:fed7:d6e4]:8080 2>/dev/null || \
                  ip6tables -t nat -A OUTPUT -d fd00:30::5078:7dff:fed7:d6e4 -p tcp --dport 8081 -j DNAT --to-destination [fd00:30::5078:7dff:fed7:d6e4]:8080
                ip6tables -t nat -C OUTPUT -d fde4:a597:c04a:1:5078:7dff:fed7:d6e4 -p tcp --dport 8081 -j DNAT --to-destination [fde4:a597:c04a:1:5078:7dff:fed7:d6e4]:8080 2>/dev/null || \
                  ip6tables -t nat -A OUTPUT -d fde4:a597:c04a:1:5078:7dff:fed7:d6e4 -p tcp --dport 8081 -j DNAT --to-destination [fde4:a597:c04a:1:5078:7dff:fed7:d6e4]:8080
            securityContext:
              runAsUser: 0
              capabilities:
                add:
                  - NET_ADMIN
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.3.3
            env:
              TZ: ${TZ}
              PRIMARY_INTERFACE: net1
              STORAGE_PATH: /data
              LOG_LEVEL: debug
              PORT: &port 5580
              NODE_OPTIONS: --max-old-space-size=768
            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --log-level=debug
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN
                  - NET_RAW
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot",
            "namespace": "networking",
            "ips": ["192.168.30.254/24", "fd00:30::254/64"],
            "mac": "02:0c:d8:a2:91:8f"
          }]
      hostUsers: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 34
        sysctls:
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "128"
    service:
      app:
        controller: matter-server
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
