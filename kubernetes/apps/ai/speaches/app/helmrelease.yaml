---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app speaches
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: speaches
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      speaches:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
            env:
              ENABLE_UI: "False"
              HF_HOME: /cache/huggingface
              HF_HUB_DISABLE_TELEMETRY: "1"
              HF_HUB_DISABLE_XET: "1"
              LOG_LEVEL: info
              PRELOAD_MODELS: '["deepdml/faster-whisper-large-v3-turbo-ct2"]'
              STT_MODEL_TTL: "-1"
              TZ: ${TZ}
              WHISPER__COMPUTE_TYPE: int8
              WHISPER__CPU_THREADS: "4"
              WHISPER__INFERENCE_DEVICE: cpu
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 90
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    persistence:
      cache:
        existingClaim: speaches-models
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port
