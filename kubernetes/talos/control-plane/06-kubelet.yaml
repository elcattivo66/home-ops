---
machine:
  kubelet:
    extraMounts:
      - destination: /var/openebs/local
        type: bind
        source: /var/openebs/local
        options: ["bind", "rshared", "rw"]
    extraConfig:
      featureGates:
        ImageVolume: true
      maxPods: 150
      allowedUnsafeSysctls:
        - net.ipv6.conf.*
    nodeIP:
      validSubnets:
        - 192.168.20.0/24