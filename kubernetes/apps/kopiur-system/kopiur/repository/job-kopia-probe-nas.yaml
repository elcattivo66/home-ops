---
# Temporary, one-shot: probe which recovery subcommands this kopia build has and
# how far the damage in the nas repository reaches. Removed after the repair.
apiVersion: batch/v1
kind: Job
metadata:
  name: kopia-probe-nas
  labels:
    app.kubernetes.io/name: kopia-probe-nas
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kopia-probe-nas
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kopia
          image: docker.io/kopia/kopia:20261103.0.2044@sha256:cd4b44d81b7eb3af260d07f2424faf75cce98bdafdef2395f65c5512a963232a
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              export HOME=/tmp
              export KOPIA_CONFIG_PATH=/tmp/kopia/repository.config
              export KOPIA_CACHE_DIRECTORY=/tmp/kopia/cache
              export KOPIA_LOG_DIR=/tmp/kopia/logs
              mkdir -p "$KOPIA_CACHE_DIRECTORY" "$KOPIA_LOG_DIR" /tmp/kopia
              kopia repository connect s3 --bucket=kopiur --endpoint=192.168.20.5:3900 \
                --region=us-east-1 --disable-tls >/dev/null 2>&1 || { echo 'CONNECT FAILED'; exit 1; }
              for cmd in 'index --help' 'blob --help' 'manifest --help' 'repository --help' 'maintenance --help'; do
                echo "=== kopia $cmd ==="
                kopia $cmd 2>&1 | grep -E '^\s{3,}[a-z][a-z0-9-]+' | head -20
              done
              echo '=== kopia index recover --help ==='
              kopia index recover --help 2>&1 | head -25
              echo '=== manifest list ==='
              kopia manifest list 2>&1 | tail -5
              echo '=== index list (count) ==='
              kopia index list 2>&1 | wc -l
              echo '=== PROBE DONE ==='
          envFrom:
            - secretRef:
                name: kopiur-repository-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
