---
# Temporary, one-shot: read-only diagnosis of the kopia repository behind
# ClusterRepository/nas. Removed again as soon as the repair is through.
apiVersion: batch/v1
kind: Job
metadata:
  name: kopia-diag-nas
  labels:
    app.kubernetes.io/name: kopia-diag-nas
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kopia-diag-nas
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kopia
          image: docker.io/kopia/kopia:20261103.0.2044@sha256:cd4b44d81b7eb3af260d07f2424faf75cce98bdafdef2395f65c5512a963232a
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              export HOME=/tmp
              export KOPIA_CONFIG_PATH=/tmp/kopia/repository.config
              export KOPIA_CACHE_DIRECTORY=/tmp/kopia/cache
              export KOPIA_LOG_DIR=/tmp/kopia/logs
              mkdir -p "$KOPIA_CACHE_DIRECTORY" "$KOPIA_LOG_DIR" /tmp/kopia
              echo '=== CONNECT ==='
              kopia repository connect s3 --bucket=kopiur --endpoint=192.168.20.5:3900 \
                --region=us-east-1 --disable-tls 2>&1 || echo 'CONNECT FAILED'
              echo '=== STATUS ==='
              kopia repository status 2>&1 || echo 'STATUS FAILED'
              echo '=== MAINTENANCE INFO ==='
              kopia maintenance info 2>&1 || echo 'MAINTINFO FAILED'
              echo '=== BLOB STATS ==='
              kopia blob stats 2>&1 || echo 'BLOBSTATS FAILED'
              echo '=== SNAPSHOT COUNT ==='
              kopia snapshot list --all --json 2>&1 | grep -c '"id"' || true
              echo '=== DIAG DONE ==='
          envFrom:
            - secretRef:
                name: kopiur-repository-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
