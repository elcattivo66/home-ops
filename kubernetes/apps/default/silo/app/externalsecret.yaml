---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secret
spec:
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgres://{{ .pg_user }}:{{ .pg_password }}@postgres-rw.databases.svc.cluster.local:5432/silo?sslmode=disable"
        SECRET_KEY: "{{ .silo_secret_key }}"
  data:
    - secretKey: pg_user
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 85ed555a-8840-486c-9ce7-f632d845e91c
        property: pg_user
    - secretKey: pg_password
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 85ed555a-8840-486c-9ce7-f632d845e91c
        property: pg_password
    - secretKey: silo_secret_key
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 85ed555a-8840-486c-9ce7-f632d845e91c
        property: secret_key
