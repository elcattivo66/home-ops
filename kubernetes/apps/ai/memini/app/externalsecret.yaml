---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-secret
spec:
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        MEMINI_POSTGRES_DSN: |-
          postgres://{{ .MEMINI_POSTGRES_USER }}:{{ .MEMINI_POSTGRES_PASS }}@postgres-rw.databases.svc.cluster.local/memini
  data:
    - secretKey: MEMINI_API_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 89932561-7139-4d7f-9be6-428cad49d1cf
        property: api_key
    - secretKey: MEMINI_POSTGRES_USER
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 89932561-7139-4d7f-9be6-428cad49d1cf
        property: pg_user
    - secretKey: MEMINI_POSTGRES_PASS
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 89932561-7139-4d7f-9be6-428cad49d1cf
        property: pg_password
