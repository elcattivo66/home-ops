---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0.6b
spec:
  format: gguf
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
      vendor: intel
  quantization: Q8_0
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0.6b
spec:
  batchSize: 8192
  contextSize: 8192
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --embedding
    - --pooling
    - last
    - --cache-ram
    - "0"
    - --no-mmap
    - --sleep-idle-seconds
    - "300"
    - --alias
    - qwen3-embedding-0.6b
    - --metrics
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10276@sha256:1d3a37a271f182203c692aedf94d479f5c738be4819af341b303a283f3bd7db0
  modelRef: qwen3-embedding-0.6b
  nodeSelector:
    kubernetes.io/hostname: nuc14
  parallelSlots: 2
  podSecurityContext:
    fsGroup: 102
    supplementalGroups:
      - 44
      - 992
  probeOverrides:
    liveness:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
    readiness:
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
    startup:
      failureThreshold: 60
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
  replicas: 1
  resources:
    cpu: 100m
    memory: 2Gi
  runtime: llamacpp
  uBatchSize: 4096
