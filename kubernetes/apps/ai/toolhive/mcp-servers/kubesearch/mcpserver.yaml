---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  # Downloads the kubesearch.dev SQLite indexes from GitHub and runs `git clone`
  # for the repo review tools -> needs egress.
  permissionProfile:
    type: builtin
    name: network
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    - name: MCP_TRANSPORT
      value: http
    - name: MCP_HTTP_HOST
      value: 0.0.0.0
    - name: KUBESEARCH_CACHE_DIR
      value: /data
    # Read-only root filesystem: git/FastMCP want a writable HOME/TMPDIR.
    - name: HOME
      value: /tmp
    - name: TMPDIR
      value: /tmp
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Cache for the ~44 MB SQLite indexes plus the warm clone pool; a restart
        # re-downloads instead of paying for a PVC on throwaway data.
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 1Gi
