---
# Temporary, one-shot: rebuild the kopia index of repo nas.
#
# One pack blob (qce65883c2707b43212591ae7f7f2fc04-s8fb3ab31c9f457ab147) cannot
# be read from Garage ("unexpected EOF"), and every manifest read loads all
# manifest contents, so notification profiles, maintenance parameters and the
# snapshot list all fail on it. `index recover` rebuilds the indexes from the
# pack blobs and drops what is unreadable, which is the prerequisite for a
# maintenance run and for backups to resume.
#
# Removed again once the repository is healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: kopia-recover-nas
  labels:
    app.kubernetes.io/name: kopia-recover-nas
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kopia-recover-nas
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kopia
          image: docker.io/kopia/kopia:20261110.0.231742@sha256:712156da45177f1099b158a7aafa084b83f7445c156e396c94525e8d57285683
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              export HOME=/tmp
              export KOPIA_CONFIG_PATH=/tmp/kopia/repository.config
              export KOPIA_CACHE_DIRECTORY=/tmp/kopia/cache
              export KOPIA_LOG_DIR=/tmp/kopia/logs
              mkdir -p "$KOPIA_CACHE_DIRECTORY" "$KOPIA_LOG_DIR" /tmp/kopia
              kopia repository connect s3 --bucket=kopiur --endpoint=192.168.20.5:3900 \
                --region=us-east-1 --disable-tls >/dev/null 2>&1 || { echo 'CONNECT FAILED'; exit 1; }

              echo '=== BAD BLOB ==='
              kopia blob list --prefix=qce65883 2>&1 | head -5

              echo '=== INDEX COUNT BEFORE ==='
              kopia index list 2>&1 | wc -l

              echo '=== INDEX RECOVER ==='
              kopia index recover 2>&1 | tail -25

              echo '=== INDEX COUNT AFTER ==='
              kopia index list 2>&1 | wc -l

              echo '=== MANIFEST LIST ==='
              kopia manifest list 2>&1 | tail -6

              echo '=== MAINTENANCE RUN FULL ==='
              kopia maintenance run --full 2>&1 | tail -25

              echo '=== SNAPSHOT TAIL ==='
              kopia snapshot list --all 2>&1 | tail -4

              echo '=== RECOVER DONE ==='
          envFrom:
            - secretRef:
                name: kopiur-repository-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 12Gi
