---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immichframe
spec:
  chartRef:
    kind: OCIRepository
    name: immichframe
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      immichframe:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -euo pipefail
                mkdir -p /app/Config
                if [ ! -f /app/Config/Settings.json ]; then
                  cp /tmp/Settings.json /app/Config/Settings.json
                fi
                chown -R 1000:1000 /app/Config
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/immichframe/immichframe
              tag: v1.0.39.0@sha256:848962b2d6828691fd95e13972ecc08c54790c03934b5d3dd3af2f302816dbe5
            env:
              TZ: ${TZ}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    persistence:
      config:
        existingClaim: immichframe
        advancedMounts:
          immichframe:
            app:
              - path: /app/Config
            init-config:
              - path: /app/Config
      settings-seed:
        type: secret
        name: immichframe-secret
        advancedMounts:
          immichframe:
            init-config:
              - path: /tmp/Settings.json
                subPath: Settings.json
                readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          immichframe:
            app:
              - path: /tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
    service:
      app:
        controller: immichframe
        ports:
          http:
            port: 8080
