---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app siloscope
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: siloscope
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      siloscope:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/neilmc78/silo-monitor
              tag: 0.2.0@sha256:407056148160f52e5eb3a7d03c3c56095c58efe3ff4cec29b66c3d0b3ada26c6
            env:
              ACTIVITY_DATA_DIR: /data/activity
              ARR_REPLACEMENTS_ENABLED: "false"
              AUTH_MODE: silo
              GOMEMLIMIT: 64MiB
              LISTEN_ADDR: ":8080"
              PLEX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: siloscope-secret
                    key: PLEX_TOKEN
              PLEX_URL: http://plex.default.svc.cluster.local:32400
              PUSH_DATA_DIR: /data/push
              REPLACEMENT_DATA_DIR: /data/replacements
              SILO_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: siloscope-secret
                    key: SILO_API_KEY
              SILO_URL: http://silo.default.svc.cluster.local:8080
              TRUSTED_PROXIES: 10.42.0.0/16
              TZ: ${TZ}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  failureThreshold: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
    service:
      app:
        controller: siloscope
        ports:
          http:
            port: 8080
