---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vouchervault-secret
spec:
  target:
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        DB_ENGINE: postgres
        POSTGRES_DB: vouchervault
        POSTGRES_HOST: postgres-rw.databases.svc.cluster.local
        POSTGRES_PASSWORD: "{{ .VOUCHERVAULT_POSTGRES_PASSWORD }}"
        POSTGRES_PORT: "5432"
        POSTGRES_USER: "{{ .VOUCHERVAULT_POSTGRES_USER }}"
        SECRET_KEY: "{{ .VOUCHERVAULT_SECRET_KEY }}"
        OIDC_OP_AUTHORIZATION_ENDPOINT: https://authelia.${SECRET_DOMAIN}/api/oidc/authorization
        OIDC_OP_JWKS_ENDPOINT: https://authelia.${SECRET_DOMAIN}/jwks.json
        OIDC_OP_TOKEN_ENDPOINT: https://authelia.${SECRET_DOMAIN}/api/oidc/token
        OIDC_OP_USER_ENDPOINT: https://authelia.${SECRET_DOMAIN}/api/oidc/userinfo
        OIDC_RP_CLIENT_ID: vouchervault
        OIDC_RP_CLIENT_SECRET: "{{ .VOUCHERVAULT_OAUTH_CLIENT_SECRET }}"
        OIDC_RP_SIGN_ALGO: RS256
  data:
    - secretKey: VOUCHERVAULT_POSTGRES_USER
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 6dba514f-a78d-4feb-b616-b2084768381a
        property: pg_user
    - secretKey: VOUCHERVAULT_POSTGRES_PASSWORD
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 6dba514f-a78d-4feb-b616-b2084768381a
        property: pg_password
    - secretKey: VOUCHERVAULT_SECRET_KEY
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 6dba514f-a78d-4feb-b616-b2084768381a
        property: secret_key
    - secretKey: VOUCHERVAULT_OAUTH_CLIENT_SECRET
      sourceRef:
        storeRef:
          name: bitwarden-fields
          kind: ClusterSecretStore
      remoteRef:
        key: 6dba514f-a78d-4feb-b616-b2084768381a
        property: oauth_client_secret
