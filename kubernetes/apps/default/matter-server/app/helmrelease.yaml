---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: matter-server
  interval: 1h
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        # initContainers:
        #   thread-route:
        #     image:
        #       repository: docker.io/library/alpine
        #       tag: "3.20.3"
        #     command:
        #       - /bin/sh
        #       - -ec
        #       - |
        #         apk add --no-cache iproute2 >/dev/null 2>&1
        #         ip -6 route replace fc00::/7 via fd00:30::248 dev net1
        #     securityContext:
        #       runAsUser: 0
        #       capabilities:
        #         add:
        #           - NET_ADMIN
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0
            env:
              TZ: ${TZ}
              PRIMARY_INTERFACE: net1
              STORAGE_PATH: /data
              LOG_LEVEL: debug
              PORT: &port 5580
              BLE_PROXY: "true"
              PRODUCTION_MODE: "true"
              NODE_OPTIONS: --max-old-space-size=768
            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --log-level=debug
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN
                  - NET_RAW
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot",
            "namespace": "networking",
            "ips": ["192.168.30.254/24", "fd00:30::254/64"],
            "mac": "02:0c:d8:a2:91:8f"
          }]
      hostUsers: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 34
        sysctls:
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "128"
    service:
      app:
        controller: matter-server
        ports:
          http:
            port: *port
            appProtocol: kubernetes.io/ws
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
