---
version: "3"

vars:
  K8S_CLUSTER: '{{.K8S_CLUSTER | default "main"}}'
  K8S_DIR: "{{.ROOT_DIR}}/kubernetes"
  MINIJINJA_CONFIG_FILE: "{{.ROOT_DIR}}/.minijinja.toml"
  TALOS_DIR: "{{.K8S_DIR}}/talos"

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubernetes/kubeconfig"
  MINIJINJA_CONFIG_FILE: "{{.ROOT_DIR}}/.minijinja.toml"
  TALOSCONFIG: "{{.K8S_DIR}}/talos/talosconfig"
  TOPFCONFIG: "{{.K8S_DIR}}/talos/topf.yaml"
  SOPS_AGE_KEY_FILE: "{{.ROOT_DIR}}/age.key"

includes:
  bootstrap: .taskfiles/Bootstrap/Taskfile.yaml
  external-secrets: .taskfiles/ExternalSecrets/Taskfile.yaml
  flux: .taskfiles/Flux/Taskfile.yaml
  sops: .taskfiles/Sops/Taskfile.yaml
  talos: .taskfiles/Talos/Taskfile.yaml
  # rook: .taskfiles/Rook/Taskfile.yaml

tasks:
  fmt:
    desc: Format YAML files with oxfmt
    cmds:
      - oxfmt --write '**/*.yaml' '**/*.yml'

  fmt:check:
    desc: Check YAML files are formatted
    cmds:
      - oxfmt --check '**/*.yaml' '**/*.yml'

  default:
    silent: true
    cmds: ["task -l"]
