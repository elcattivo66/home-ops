---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-dragonfly-prometheus-metrics
spec:
  podSelector:
    matchLabels:
      app: ${APP}-dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9999
    # The operator no longer ships NetworkPolicies of its own, so this policy is
    # the only ingress rule a Dragonfly pod gets: without an explicit allow the
    # app's own pods are denied when they dial the Redis port.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    # The dragonfly-operator reads INFO persistence over the Redis port from the
    # databases namespace before it marks an instance ready. If that probe is
    # blocked, the operator reconcile loops on "failed to determine dataset load
    # status" and the instance never becomes Ready.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              control-plane: controller-manager
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9999
