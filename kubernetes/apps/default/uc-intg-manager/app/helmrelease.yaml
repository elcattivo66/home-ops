---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app uc-intg-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: uc-intg-manager
  values:
    controllers:
      uc-intg-manager:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jackjpowell/uc-intg-manager
              tag: v3.3.3@sha256:0d571d585a0f53c7f1e51f4cdc80a42fbfc44d6d2bba07c1cc89314c717aa354
            env:
              TZ: ${TZ}
              UC_INTG_MANAGER_HTTP_PORT: &port 9999
              UC_MDNS_LOCAL_HOSTNAME: uc-intg-ws.${SECRET_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":"multus-iot",
            "namespace": "networking",
            "ips": ["192.168.30.250/24"],
            "mac": "fa:8e:69:4b:6f:77"
          }]
    service:
      app:
        ports:
          http:
            port: *port
      api:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "uc-intg-ws.${SECRET_DOMAIN}"
          lbipam.cilium.io/ips: 192.168.21.223
        ports:
          api:
            port: 9090
    route:
      app:
        hostnames:
          - "uc-intg.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      tmpfs:
        type: emptyDir
        advancedMounts:
          uc-intg-manager:
            app:
              - path: /.ucintg
                subPath: ucintg
              - path: /tmp
                subPath: tmp
